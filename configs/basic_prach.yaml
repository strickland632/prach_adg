# Match RX RF chain
g_tx_rate: 23.04e6       # = 23040000
g_center_freq_hz: 1.84205e9  # = 1842050000
g_tx_gain_db: 0.0        # bump this if power is too low

rf:

    device: "uhd"
    device_args: "type=b200,clock=internal"
    output_file: "./out/uhd_1.cf32"
