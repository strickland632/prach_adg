
is_nr: true
nof_prb: 50 #carrier bandwith frp, PRB- physical resource block
config_idx: 0 #given direct from SIB1
root_seq_idx: 1 #given from SIB 1839: 1
zero_corr_zone: 15 #given direct from SIB1, tells distinct cyclic shifts per root
freq_offset: 1 #msg1_teq_start from sib?
num_ra_preambles: 64 #from SIB?

# g_tx_rate: 1.92e6
# g_center_freq_hz: .850e9
